backend: mock
camera: 0
video: null
pc_host: 0.0.0.0
pc_port: 9001
robot_ip: 192.168.1.50
robot_port: 9000
max_speed: 35
smoothing: 0.25
dead_zone: 5
looming_threshold: 0.3
watchdog_timeout: 0.5
invert_left: false
invert_right: false
dataset_path: data/malecns-v1.0  # used by backend: malecns
brain_seed: 0
cruise: 0.4            # constant forward command; the connectome steers and escapes
fast_modulators: false # true = dopamine/octopamine/serotonin act as fast excitation
wiring: connectome     # shuffled = negative control
imu_axes: x,y,z        # robot x forward, y left, z up in sensor axes, e.g. -y,x,z
body_feedback: false   # experimental: tilt drives Johnston's organ (see VALIDATION.md 4d)
device: auto           # auto, cpu or cuda; identical results
vision: flow           # flow, or experimental retina (see VALIDATION.md 5b)
logging_level: INFO
