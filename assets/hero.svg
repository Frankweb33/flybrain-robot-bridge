<text x="56" y="169" fill="#f2f8fc" font-size="66" font-weight="700" letter-spacing="-2">FlyBrain</text><text x="56" y="239" fill="#f2f8fc" font-size="66" font-weight="700" letter-spacing="-2">Robot Bridge</text>
<text x="58" y="287" fill="#a0b7c6" font-size="22">From visual signals to physical motion.</text>
<text x="58" y="320" fill="#6b899d" font-size="17">A small, inspectable starting point for embodied neural models.</text>
