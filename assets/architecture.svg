<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">FlyBrain Robot Bridge architecture</title><desc id="desc">Camera and IMU feed a mock brain backend; motor commands travel over UDP to a future robot.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#58e4bd"/></marker></defs>
<rect width="1200" height="620" rx="24" fill="#0b1420"/>
<g font-family="Arial, sans-serif"><text x="60" y="62" fill="#58e4bd" font-size="15" letter-spacing="4">EXPERIMENTAL SYSTEM / 0.1</text>
<text x="60" y="116" fill="#f0f6fc" font-size="42" font-weight="bold">FlyBrain Robot Bridge</text>
<text x="60" y="153" fill="#94a8ba" font-size="19">From visual signals to motion. A small, inspectable demonstrator.</text>
<rect x="60" y="220" width="310" height="126" rx="14" fill="#142334" stroke="#2e4a5f"/><text x="82" y="248" fill="#58e4bd" font-size="12" letter-spacing="2">01 / INPUT</text><text x="82" y="285" fill="#edf6fa" font-size="25">Webcam</text><text x="82" y="316" fill="#94a8ba" font-size="16">or synthetic frames</text>
<rect x="420" y="220" width="310" height="126" rx="14" fill="#142334" stroke="#2e4a5f"/><text x="442" y="248" fill="#58e4bd" font-size="12" letter-spacing="2">02 / ENCODE</text><text x="442" y="285" fill="#edf6fa" font-size="25">Visual Encoder</text><text x="442" y="316" fill="#94a8ba" font-size="16">optical flow + looming</text>
<rect x="780" y="220" width="310" height="126" rx="14" fill="#142334" stroke="#2e4a5f"/><text x="802" y="248" fill="#58e4bd" font-size="12" letter-spacing="2">03 / COMPUTE</text><text x="802" y="285" fill="#edf6fa" font-size="25">Brain Backend</text><text x="802" y="316" fill="#94a8ba" font-size="16">mock now · MaleCNS later</text>
<rect x="780" y="400" width="310" height="126" rx="14" fill="#142334" stroke="#2e4a5f"/><text x="802" y="428" fill="#58e4bd" font-size="12" letter-spacing="2">04 / DECODE</text><text x="802" y="465" fill="#edf6fa" font-size="25">Motor Decoder</text><text x="802" y="496" fill="#94a8ba" font-size="16">limits + smoothing + stop</text>
<rect x="420" y="400" width="310" height="126" rx="14" fill="#142334" stroke="#2e4a5f"/><text x="442" y="428" fill="#58e4bd" font-size="12" letter-spacing="2">05 / TRANSPORT</text><text x="442" y="465" fill="#edf6fa" font-size="25">Wi-Fi / UDP</text><text x="442" y="496" fill="#94a8ba" font-size="16">validated JSON packets</text>
<rect x="60" y="400" width="310" height="126" rx="14" fill="#142334" stroke="#2e4a5f"/><text x="82" y="428" fill="#58e4bd" font-size="12" letter-spacing="2">06 / HARDWARE</text><text x="82" y="465" fill="#edf6fa" font-size="25">Strandbeest Robot</text><text x="82" y="496" fill="#94a8ba" font-size="16">future hardware integration</text>
<g fill="none" stroke="#58e4bd" stroke-width="2" marker-end="url(#arrow)"><path d="M370 283H416"/><path d="M730 283H776"/><path d="M935 346V396"/><path d="M780 463H734"/><path d="M420 463H374"/><path d="M215 526V578H1140V283H1094" stroke-dasharray="6 6"/></g><rect x="450" y="558" width="350" height="37" rx="8" fill="#0b1420"/><text x="470" y="582" fill="#58e4bd" font-size="17">IMU feedback → Brain Backend</text></g></svg>