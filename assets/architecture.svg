<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">FlyBrain Robot Bridge architecture</title><desc id="desc">Camera features drive a whole-CNS spiking simulation of the MaleCNS connectome; descending-neuron activity becomes motor commands sent over UDP to an ESP32 robot receiver.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#58e4bd"/></marker></defs>
<rect width="1200" height="620" rx="24" fill="#0b1420"/>
<g font-family="Arial, sans-serif"><text x="60" y="62" fill="#58e4bd" font-size="15" letter-spacing="4">EXPERIMENTAL SYSTEM / 0.2</text>
<text x="60" y="116" fill="#f0f6fc" font-size="42" font-weight="bold">FlyBrain Robot Bridge</text>
<text x="60" y="153" fill="#94a8ba" font-size="19">Camera motion → 166,700 simulated MaleCNS neurons → two motors.</text>
<rect x="60" y="220" width="310" height="126" rx="14" fill="#142334" stroke="#2e4a5f"/><text x="82" y="248" fill="#58e4bd" font-size="12" letter-spacing="2">01 / INPUT</text><text x="82" y="285" fill="#edf6fa" font-size="25">Webcam</text><text x="82" y="316" fill="#94a8ba" font-size="16">or synthetic frames</text>
<rect x="420" y="220" width="310" height="126" rx="14" fill="#142334" stroke="#2e4a5f"/><text x="442" y="248" fill="#58e4bd" font-size="12" letter-spacing="2">02 / ENCODE</text><text x="442" y="285" fill="#edf6fa" font-size="25">Visual Encoder</text><text x="442" y="316" fill="#94a8ba" font-size="16">looming + object motion</text>
<rect x="780" y="220" width="310" height="126" rx="14" fill="#142334" stroke="#2e4a5f"/><text x="802" y="248" fill="#58e4bd" font-size="12" letter-spacing="2">03 / COMPUTE</text><text x="802" y="285" fill="#edf6fa" font-size="25">MaleCNS LIF model</text><text x="802" y="316" fill="#94a8ba" font-size="16">166,700 neurons · or mock</text>
<rect x="780" y="400" width="310" height="126" rx="14" fill="#142334" stroke="#2e4a5f"/><text x="802" y="428" fill="#58e4bd" font-size="12" letter-spacing="2">04 / DECODE</text><text x="802" y="465" fill="#edf6fa" font-size="25">Motor Decoder</text><text x="802" y="496" fill="#94a8ba" font-size="16">GF escape · DNa01/02 steer</text>
<rect x="420" y="400" width="310" height="126" rx="14" fill="#142334" stroke="#2e4a5f"/><text x="442" y="428" fill="#58e4bd" font-size="12" letter-spacing="2">05 / TRANSPORT</text><text x="442" y="465" fill="#edf6fa" font-size="25">Wi-Fi / UDP</text><text x="442" y="496" fill="#94a8ba" font-size="16">validated JSON packets</text>
<rect x="60" y="400" width="310" height="126" rx="14" fill="#142334" stroke="#2e4a5f"/><text x="82" y="428" fill="#58e4bd" font-size="12" letter-spacing="2">06 / HARDWARE</text><text x="82" y="465" fill="#edf6fa" font-size="25">Strandbeest Robot</text><text x="82" y="496" fill="#94a8ba" font-size="16">ESP32 firmware · not yet tested</text>
