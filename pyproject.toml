[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flybrain-robot-bridge"
version = "0.2.0"
description = "Camera-to-robot bridge driven by a whole-CNS spiking simulation of the MaleCNS Drosophila connectome"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "opencv-python-headless>=4.8", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
demo = ["Pillow>=10"]
connectome = ["numba>=0.60", "pandas>=2", "pyarrow>=15"]
reference = ["brian2>=2.7"]
# CUDA 13 drivers; use numba-cuda-mlir[cu12] with CUDA 12 drivers.
gpu = ["numba-cuda-mlir[cu13]>=0.5.2"]

[project.scripts]
flybrain-robot = "flybrain_robot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:brian2.*",
    "ignore:.*parseAll.*",
    "ignore:Grid size .* under-utilization",
    "ignore:Host array used in CUDA kernel",
    "ignore:__int__ returned non-int:DeprecationWarning",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
